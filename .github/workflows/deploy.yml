# CI / Deploy to production
#
# On every push or PR to main, run the full quality-gate suite (typecheck, lint,
# self-check, build). On a real merge/push to main, and only if the gates pass,
# deploy the built output straight to the production EC2 box.
#
# How the deploy works (direct, no S3):
#   The build is rsync'd straight onto the box over SSH, tunneled through AWS
#   SSM Session Manager (AWS-StartSSHSession) — so port 22 never opens to the
#   internet and no artifact bucket is needed. Then migrate + restart + a
#   localhost /api/health check run over the same SSH connection.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID      IAM user for the runner. Needs: ssm:StartSession on
#   AWS_SECRET_ACCESS_KEY  the instance + the AWS-StartSSHSession document, and
#                          ssm:TerminateSession.
#   SSH_PRIVATE_KEY        Private key of the dedicated CI deploy keypair whose
#                          public key is in the box's ~ubuntu/.ssh/authorized_keys.
#
# The instance must be SSM-managed (instance profile with AmazonSSMManagedInstanceCore
# + the SSM agent running) and have node/npm available to the `ubuntu` user.
# ─────────────────────────────────────────────────────────────────────────────

name: CI / Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ───────────────────────────── Quality gates ─────────────────────────────
  test:
    name: Test & build (all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- Backend: typecheck + build (build also copies schema.sql → dist) ----
      - name: Backend — install
        working-directory: backend
        run: npm ci
      - name: Backend — typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Backend — build
        working-directory: backend
        run: npm run build

      # ---- Frontend: lint + csv self-check + build (build also typechecks) ----
      - name: Frontend — install
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend — csv self-check
        working-directory: frontend
        run: npm run check
      - name: Frontend — build
        working-directory: frontend
        run: npm run build

      # ---- Hand the built output to the deploy job (no rebuild needed) ----
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            frontend/dist

  # ──────────────────── Deploy (rsync over SSM tunnel) ─────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    # Only on a real merge/push to main — never on pull requests or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Serialize deploys so two runs never race on the same instance.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-097cc672e9a49a72e
      BACKEND_DIR: /opt/rooconnect
      FRONTEND_DIR: /var/www/rooconnect
      SERVICE: rooconnect
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install session-manager-plugin
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb
          session-manager-plugin --version

      - name: Set up SSH over the SSM tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 'deploy-target' resolves to the instance id; SSH is tunneled through
          # SSM, so no public IP or open port 22 is involved.
          {
            echo "Host deploy-target"
            echo "  HostName ${INSTANCE_ID}"
            echo "  User ubuntu"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  ProxyCommand sh -c \"aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ${AWS_REGION}\""
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config

      - name: Sync build to server
        run: |
          set -euo pipefail
          RSH="ssh -F $HOME/.ssh/config"
          # Backend compiled output (schema.sql lives inside dist/db from the build).
          rsync -az --delete -e "$RSH" backend/dist/ "deploy-target:${BACKEND_DIR}/dist/"
          # Dependency manifests so a prod install runs cleanly on the box.
          rsync -az -e "$RSH" backend/package.json backend/package-lock.json "deploy-target:${BACKEND_DIR}/"
          # Frontend static bundle (--delete clears stale hashed assets).
          rsync -az --delete -e "$RSH" frontend/dist/ "deploy-target:${FRONTEND_DIR}/"

      - name: Install deps, migrate, restart & health-check
        run: |
          set -euo pipefail
          # Unquoted heredoc: ${BACKEND_DIR}/${SERVICE} expand on the runner; the
          # \$-escaped bits run on the box.
          ssh -F "$HOME/.ssh/config" deploy-target bash -s <<REMOTE
          set -eu
          cd "${BACKEND_DIR}"
          echo "Installing prod deps + migrating…"
          npm ci --omit=dev --no-audit --no-fund
          npm run db:migrate:prod
          echo "Restarting service…"
          sudo systemctl restart "${SERVICE}"
          echo "Verifying /api/health…"
          ok=0
          for _ in \$(seq 1 15); do
            if curl -fsS http://localhost/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "\$ok" = 1 ] || { echo "health check FAILED — /api/health did not come up"; exit 1; }
          echo "Deploy complete and healthy."
          REMOTE
