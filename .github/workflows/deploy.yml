# CI / Deploy to production
#
# On every push or PR to main, run the full quality-gate suite (typecheck, lint,
# self-check, build). On a real merge/push to main, and only if the gates pass,
# deploy the built output straight to the production EC2 box.
#
# How the deploy works (direct, no S3):
#   The build is rsync'd straight onto the box over SSH, tunneled through AWS
#   SSM Session Manager (AWS-StartSSHSession) — so port 22 never opens to the
#   internet and no artifact bucket is needed. Then migrate + restart + a
#   localhost /api/health check run over the same SSH connection.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID      IAM user for the runner. Needs: ssm:StartSession on
#   AWS_SECRET_ACCESS_KEY  the instance + the AWS-StartSSHSession document, and
#                          ssm:TerminateSession.
#   SSH_PRIVATE_KEY        Private key of the dedicated CI deploy keypair whose
#                          public key is in the box's ~ubuntu/.ssh/authorized_keys.
#
# The instance must be SSM-managed (instance profile with AmazonSSMManagedInstanceCore
# + the SSM agent running) and have node/npm available to the `ubuntu` user.
# ─────────────────────────────────────────────────────────────────────────────

name: CI / Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ───────────────────────────── Quality gates ─────────────────────────────
  test:
    name: Test & build (all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- Backend: typecheck + build (build also copies schema.sql → dist) ----
      - name: Backend — install
        working-directory: backend
        run: npm ci
      - name: Backend — typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Backend — build
        working-directory: backend
        run: npm run build

      # ---- Frontend: lint + csv self-check + build (build also typechecks) ----
      - name: Frontend — install
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend — csv self-check
        working-directory: frontend
        run: npm run check
      - name: Frontend — build
        working-directory: frontend
        run: npm run build

      # ---- Hand the built output to the deploy job (no rebuild needed) ----
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            frontend/dist

  # ──────────────────── Deploy (rsync over SSM tunnel) ─────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    # Only on a real merge/push to main — never on pull requests or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Serialize deploys so two runs never race on the same instance.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-097cc672e9a49a72e
      BACKEND_DIR: /opt/rooconnect
      # Written into the box's .env on every deploy. "auto" = let the instance
      # detect its own public address; set the APP_URL repository variable to
      # a fixed domain (e.g. https://alumni.rooman.com) to pin it instead.
      APP_URL_VALUE: ${{ vars.APP_URL || 'auto' }}
      FRONTEND_DIR: /var/www/rooconnect
      SERVICE: rooconnect
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install session-manager-plugin
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb
          session-manager-plugin --version

      - name: Set up SSH over the SSM tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 'deploy-target' resolves to the instance id; SSH is tunneled through
          # SSM, so no public IP or open port 22 is involved.
          {
            echo "Host deploy-target"
            echo "  HostName ${INSTANCE_ID}"
            echo "  User ubuntu"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  ProxyCommand sh -c \"aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ${AWS_REGION}\""
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config

      - name: Sync build to server
        run: |
          set -euo pipefail
          RSH="ssh -F $HOME/.ssh/config"
          # Backend compiled output (schema.sql lives inside dist/db from the build).
          rsync -az --delete -e "$RSH" backend/dist/ "deploy-target:${BACKEND_DIR}/dist/"
          # Dependency manifests so a prod install runs cleanly on the box.
          rsync -az -e "$RSH" backend/package.json backend/package-lock.json "deploy-target:${BACKEND_DIR}/"
          # Frontend static bundle (--delete clears stale hashed assets).
          rsync -az --delete -e "$RSH" frontend/dist/ "deploy-target:${FRONTEND_DIR}/"

      - name: Install deps, migrate, restart & health-check
        run: |
          set -euo pipefail
          # Unquoted heredoc: ${BACKEND_DIR}/${SERVICE} expand on the runner; the
          # \$-escaped bits run on the box.
          #
          # APP_URL_VALUE travels base64-encoded and is decoded on the box.
          # `ssh host CMD…` does not pass argv the way exec does: OpenSSH joins
          # its command arguments into one string and the remote LOGIN SHELL
          # re-parses it, so `ssh host VAR=x bash -s` is shell source, not an
          # environment assignment — the same sink as interpolating into the
          # script text. An "&" in the value backgrounds the assignment and
          # starts bash -s with the variable unset, aborting under `set -eu`
          # after rsync but before migrate and restart, leaving a half-deployed
          # box; "\$(…)", backticks and ";" would execute as a user with
          # passwordless sudo. Base64's alphabet (A-Za-z0-9+/=) holds no shell
          # metacharacter, so the encoded form is safe to interpolate, and the
          # decoded value lands in a variable that nothing parses again.
          APP_URL_B64="$(printf '%s' "$APP_URL_VALUE" | base64 | tr -d '\n')"
          ssh -F "$HOME/.ssh/config" deploy-target bash -s <<REMOTE
          set -euo pipefail
          APP_URL_VALUE="\$(printf '%s' '${APP_URL_B64}' | base64 -d)"
          [ -n "\$APP_URL_VALUE" ] || { echo "APP_URL_VALUE decoded empty — refusing to rewrite .env." >&2; exit 1; }
          cd "${BACKEND_DIR}"
          # Keep APP_URL in step with reality. The instance has no Elastic IP,
          # so its public address changes on every stop/start, and .env is a
          # file nothing rewrites — twice now every outgoing email kept
          # pointing at the previous address until someone edited it by hand.
          #
          # "auto" makes the API ask EC2 for its own address at startup (see
          # backend/src/publicUrl.ts), so a restart is enough to correct it.
          # Set the APP_URL repository variable to a domain to override.
          #
          # APP_URL_FALLBACK records the address observed at deploy time. If
          # metadata is ever unreachable at startup, links fall back to that
          # instead of localhost — the health check only ever talks to
          # localhost, so such a failure would otherwise ship green.
          echo "Ensuring APP_URL=\$APP_URL_VALUE in .env…"
          # Create .env when absent AND keep it owner-only. \`sudo touch\` alone
          # left a missing .env root-owned 0644 on a rebuilt instance, and the
          # cp below preserves the destination's mode, so the secrets would
          # have stayed world-readable for the life of that box.
          #
          # chown as well as chmod, because 600 on its own locks the app OUT.
          # sudo touch creates the file owned by root, but neither the migrate
          # below nor the systemd service runs as root — both run as this same
          # deploy user — and dotenv swallows the resulting EACCES silently
          # (env.ts now reports it). The box then starts with no DATABASE_URL
          # and no NODE_ENV and fails against the dev Postgres default, which
          # names a port that does not exist in prod rather than the real
          # cause. id -un is used rather than a literal name so the owner is
          # by construction the account that reads the file.
          sudo touch .env
          sudo chown "\$(id -un):\$(id -gn)" .env
          sudo chmod 600 .env
          # Staged through mktemp rather than a fixed /tmp name. The redirect
          # runs as the unprivileged deploy user at umask 022, so a predictable
          # path meant the whole decrypted .env sat world-readable, under a
          # name any local user could pre-create as a symlink for the root cp
          # to follow. mktemp creates 0600 with an unguessable name, and the
          # trap clears both files even when the script aborts early.
          ENV_TMP="\$(mktemp)"
          ENV_TMP2="\$(mktemp)"
          trap 'rm -f "\$ENV_TMP" "\$ENV_TMP2"' EXIT
          chmod 600 "\$ENV_TMP" "\$ENV_TMP2"
          # Back up before rewriting. None of DATABASE_URL, JWT_SECRET,
          # SMTP_PASS or OPENROUTER_API_KEY exists in the repo — they live only
          # on the box — so a bad rewrite means reconstructing them by hand.
          sudo cp -p .env .env.bak
          sudo chmod 600 .env.bak
          # grep exits 1 when it legitimately matched every line, and 2 on a
          # real read error. \`|| true\` masked both, and the copy at the end was
          # unconditional, so any read failure replaced .env with just the one
          # line printf appended — destroying every secret on the box.
          set +e
          sudo grep -v '^APP_URL=' .env > "\$ENV_TMP"
          rc=\$?
          set -e
          if [ "\$rc" -gt 1 ]; then
            echo "Could not read .env (grep exit \$rc) — leaving it untouched." >&2
            exit 1
          fi
          # Rewritten rather than sed'd: no replacement-syntax metacharacters,
          # and printf %s leaves the value exactly as supplied.
          printf 'APP_URL=%s\n' "\$APP_URL_VALUE" >> "\$ENV_TMP"
          TOKEN=\$(curl -sS -m 3 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' || true)
          PUBIP=\$(curl -sS -m 3 -H "X-aws-ec2-metadata-token: \$TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4 || true)
          if echo "\$PUBIP" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+\$'; then
            echo "Recording APP_URL_FALLBACK=http://\$PUBIP"
            set +e
            grep -v '^APP_URL_FALLBACK=' "\$ENV_TMP" > "\$ENV_TMP2"
            rc=\$?
            set -e
            if [ "\$rc" -gt 1 ]; then
              echo "Could not read the staged env file (grep exit \$rc)." >&2
              exit 1
            fi
            printf 'APP_URL_FALLBACK=http://%s\n' "\$PUBIP" >> "\$ENV_TMP2"
            cat "\$ENV_TMP2" > "\$ENV_TMP"
          else
            echo "No public IPv4 from metadata; leaving APP_URL_FALLBACK unchanged."
          fi
          # Last gate before the file goes live. The staged file must be
          # non-empty and must still carry every line that is not one of the
          # APP_URL keys this step rewrites, or the original stays put.
          if [ ! -s "\$ENV_TMP" ]; then
            echo "Refusing to install an empty .env — original left in place." >&2
            exit 1
          fi
          kept_before=\$(sudo grep -vc '^APP_URL' .env || true)
          kept_after=\$(grep -vc '^APP_URL' "\$ENV_TMP" || true)
          if [ "\$kept_after" -lt "\$kept_before" ]; then
            echo "Refusing to install .env: \$kept_before non-APP_URL lines before, \$kept_after after." >&2
            exit 1
          fi
          # cp onto an existing file keeps that file's owner, so this repeats
          # the chown rather than relying on it: the one case that matters is
          # a .env this step had to create from nothing, and re-stating it
          # costs nothing and cannot regress.
          sudo cp "\$ENV_TMP" .env
          sudo chown "\$(id -un):\$(id -gn)" .env
          sudo chmod 600 .env
          echo "Installing prod deps + migrating…"
          npm ci --omit=dev --no-audit --no-fund
          npm run db:migrate:prod
          echo "Restarting service…"
          sudo systemctl restart "${SERVICE}"
          echo "Verifying /api/health…"
          ok=0
          for _ in \$(seq 1 15); do
            if curl -fsS http://localhost/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "\$ok" = 1 ] || { echo "health check FAILED — /api/health did not come up"; exit 1; }
          echo "Deploy complete and healthy."
          REMOTE
